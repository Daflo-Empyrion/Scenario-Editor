<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche du scénario — digest</title>
<style>
:root{
  --bg:#05070D; --line:rgba(130,205,255,.10); --line-strong:rgba(130,205,255,.28);
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --amber:#FFC24D;
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{border-bottom:1px solid var(--line);background:rgba(10,15,26,.7)}
.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px}
.bar label{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.path{flex:1;height:28px;border-radius:8px;border:1px solid var(--line);
  background:rgba(6,11,20,.72);color:var(--txt);font:12px var(--mono);
  padding:0 9px;outline:none}
.path:focus{border-color:rgba(0,229,255,.45)}
.tbtn{height:28px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);padding:0 11px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  color:var(--muted);font:11.5px var(--font);
  transition:border-color .12s, color .12s, background .12s}
.tbtn:hover{color:var(--txt);border-color:rgba(0,229,255,.45);
  background:rgba(0,229,255,.10)}
.tbtn:disabled{opacity:.4;cursor:default;pointer-events:none}
.tbtn.primary{border-color:rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  color:#DFFAFF;font-weight:600}
.tbtn.primary:hover{background:rgba(0,229,255,.28)}
.preview{flex:1;overflow:auto;margin:0;padding:12px 16px;
  font:12px var(--mono);color:var(--muted);white-space:pre-wrap;
  word-break:break-word;user-select:text}
.preview::-webkit-scrollbar{width:11px;height:11px}
.preview::-webkit-scrollbar-track{background:rgba(8,12,21,.4)}
.preview::-webkit-scrollbar-thumb{background:rgba(130,205,255,.20);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
.preview:empty::after{content:"";display:block}
.status{padding:6px 12px;font:11px var(--mono);color:var(--muted);
  border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-height:24px;background:rgba(10,15,26,.7)}
.status.on{color:var(--amber)}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <label for="path" id="lbl_scenario"></label>
    <input class="path" id="path" spellcheck="false">
    <button class="tbtn" id="btn_browse"></button>
    <button class="tbtn primary" id="btn_run"></button>
    <button class="tbtn" id="btn_export"></button>
    <button class="tbtn" id="btn_info" title=""></button>
  </div>
</div>
<pre class="preview" id="preview"></pre>
<div class="status" id="status"></div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function boot(){
  if (typeof qt==="undefined"||!qt.webChannelTransport){ setTimeout(boot,300); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.bridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_init(m => shape(JSON.parse(m)));
  });
}

function shape(m){
  const L=m.labels;
  $("lbl_scenario").textContent=L.scenario;
  if (document.activeElement!==$("path")) $("path").value=m.path||"";
  $("path").placeholder=L.scenario_hint;
  $("btn_browse").textContent=L.browse;
  $("btn_run").textContent=L.run;
  $("btn_run").disabled=!!m.running;
  $("btn_export").textContent=L.export;
  $("btn_export").disabled=!m.export_enabled;
  $("btn_info").textContent=L.info;
  $("btn_info").title=L.info_tip;
  $("preview").textContent=m.text;
  $("status").textContent=m.status;
  $("status").classList.toggle("on",!!m.running);
}

$("path").addEventListener("change",e=>BRIDGE.set_path(e.target.value));
$("btn_browse").onclick=()=>BRIDGE.run_action("browse");
$("btn_run").onclick=()=>{ BRIDGE.set_path($("path").value);
                           BRIDGE.run_action("run"); };
$("btn_export").onclick=()=>BRIDGE.run_action("export");
$("btn_info").onclick=()=>BRIDGE.run_action("info");
boot();
</script>
</body>
</html>
