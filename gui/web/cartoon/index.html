<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Look cartoon</title>
<style>
:root{
  --bg:#05070D; --line:rgba(130,205,255,.10); --line-strong:rgba(130,205,255,.28);
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --amber:#FFC24D;
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;font-size:12px}
.top{border-bottom:1px solid var(--line);background:rgba(10,15,26,.7);padding:8px 12px}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prow label{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.path{flex:1;height:26px;border-radius:8px;border:1px solid var(--line);
  background:rgba(6,11,20,.72);color:var(--txt);font:12px var(--mono);
  padding:0 9px;outline:none}
.path:focus{border-color:rgba(0,229,255,.45)}
select,.num{height:26px;border-radius:8px;border:1px solid var(--line);
  background:rgba(6,11,20,.72);color:var(--txt);font:12px var(--font);
  padding:0 6px;outline:none}
select:focus,.num:focus{border-color:rgba(0,229,255,.45)}
.num{width:86px}
.tbtn{height:26px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);padding:0 10px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  color:var(--muted);font:11.5px var(--font)}
.tbtn:hover{color:var(--txt);border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.10)}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tbtn.primary{border-color:rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  color:#DFFAFF;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:6px 0}
.frow{display:flex;align-items:center;gap:8px}
.frow label{flex:1;font:11px var(--font);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;align-items:center;gap:8px;margin:4px 0}
.mid .sep{font:11px var(--mono);color:var(--dim)}
.cols{flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px;
  background:rgba(8,12,21,.5);padding:4px 10px}
.cols::-webkit-scrollbar,.report::-webkit-scrollbar{width:10px}
.cols::-webkit-scrollbar-thumb,.report::-webkit-scrollbar-thumb{
  background:rgba(130,205,255,.20);border-radius:6px}
.crow{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;align-items:center;
  padding:3px 0;border-bottom:1px solid var(--line)}
.crow .lab{font:11px var(--mono);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sw{height:14px;border-radius:4px;border:1px solid #666}
.csec{font:600 11px var(--mono);color:#8FE7F5;padding:5px 0 2px}
.empty{font:11.5px var(--font);color:var(--dim);padding:10px 4px}
.report{height:110px;overflow:auto;border-top:1px solid var(--line);
  padding:6px 12px;font:11px var(--mono);color:var(--muted);white-space:pre-wrap}
.status{padding:5px 12px;font:11px var(--mono);color:var(--muted);
  border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sw2{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.chk{display:flex;align-items:center;gap:6px;font:11.5px var(--font);
  color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="prow">
    <label for="path" id="lbl_scenario"></label>
    <input class="path" id="path" spellcheck="false">
    <button class="tbtn" id="btn_browse"></button>
    <label class="chk"><input type="checkbox" id="force"> <span id="lbl_force"></span></label>
  </div>
  <div class="sep" id="lbl_preset"></div>
  <div class="fgrid" id="fgrid"></div>
  <div class="mid">
    <button class="tbtn" id="btn_preview"></button>
    <button class="tbtn primary" id="btn_apply"></button>
    <button class="tbtn" id="btn_defaults"></button>
    <span style="flex:1"></span>
    <button class="tbtn" id="btn_info"></button>
  </div>
</div>
<div class="sw2" style="padding-top:8px">
  <span class="sep" id="lbl_colors"></span>
  <select id="pf" style="flex:1"></select>
</div>
<div class="cols" id="cols"></div>
<div class="sw2" style="padding-top:8px">
  <span class="sep" id="lbl_backups"></span>
  <select id="backup" style="flex:1"></select>
  <button class="tbtn" id="btn_restore"></button>
</div>
<div class="report" id="report"></div>
<div class="status" id="status"></div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null, M=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function boot(){
  if (typeof qt==="undefined"||!qt.webChannelTransport){ setTimeout(boot,300); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.bridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_init(m => shape(JSON.parse(m)));
  });
}

function shape(m){
  M=m; const L=m.labels;
  $("lbl_scenario").textContent=L.scenario;
  if (document.activeElement!==$("path")) $("path").value=m.path||"";
  $("path").placeholder=L.scenario_hint;
  $("btn_browse").textContent=L.browse;
  $("lbl_force").textContent=L.force;
  $("force").checked=m.force;
  $("lbl_preset").textContent=L.preset;
  $("btn_preview").textContent=L.preview;
  $("btn_apply").textContent=L.apply;
  $("btn_defaults").textContent=L.defaults;
  $("btn_info").textContent=L.info;
  $("lbl_colors").textContent=L.colors;
  $("lbl_backups").textContent=L.backups;
  $("btn_restore").textContent=L.restore;
  $("btn_restore").disabled=m.running||!m.backups.length;
  $("btn_preview").disabled=m.running;
  $("btn_apply").disabled=m.running;
  /* facteurs : reconstruits seulement si la structure change, sinon juste
     les valeurs (evite de perdre le focus pendant la saisie) */
  const sig=m.factors.map(f=>f.key).join(",");
  if ($("fgrid").dataset.sig!==sig){
    $("fgrid").dataset.sig=sig;
    $("fgrid").innerHTML=m.factors.map(f=>
      `<div class="frow"><label title="${esc(f.tip)}">${esc(f.label)}</label>`
      +`<input class="num" type="number" data-k="${esc(f.key)}" min="${f.min}" max="${f.max}" step="${f.step}"></div>`).join("");
  }
  document.querySelectorAll("#fgrid .num").forEach(inp=>{
    const f=m.factors.find(x=>x.key===inp.dataset.k);
    if (f && document.activeElement!==inp) inp.value=(+f.value).toFixed(f.dec);
  });
  const pfSig=m.playfields.join("|");
  if ($("pf").dataset.sig!==pfSig){
    $("pf").dataset.sig=pfSig;
    $("pf").innerHTML=m.playfields.map(n=>`<option>${esc(n)}</option>`).join("");
  }
  if ($("pf").value!==m.pf) $("pf").value=m.pf;
  const bSig=m.backups.join("|");
  if ($("backup").dataset.sig!==bSig){
    $("backup").dataset.sig=bSig;
    $("backup").innerHTML=m.backups.map(n=>`<option>${esc(n)}</option>`).join("");
  }
  if ($("backup").value!==m.backup) $("backup").value=m.backup;
  /* couleurs : sections ciel/terrain, nuances r,g,b */
  let html="";
  const secs=[["ciel",L.section_ciel],["terrain",L.section_terrain]];
  let any=false;
  for (const [key,lab] of secs){
    const items=m.colors[key]||[];
    if (!items.length) continue;
    any=true;
    html+=`<div class="csec">${esc(lab||key)}</div>`;
    for (const [label,old,newv] of items)
      html+=`<div class="crow"><span class="lab" title="${esc(label)}">${esc(label)}</span>`
        +`<span class="sw" style="background:${css(old)}"></span>`
        +`<span class="sw" style="background:${css(newv)}"></span></div>`;
  }
  $("cols").innerHTML=any?html:`<div class="empty">${esc(L.none)}</div>`;
  $("report").textContent=m.report||"";
  $("status").textContent=m.status;
  $("status").classList.toggle("on",!!m.running);
}

function css(v){
  const nums=String(v).replace(/[()]/g,"").split(",").map(x=>parseFloat(x));
  if (nums.length!==3||nums.some(n=>isNaN(n))) return "transparent";
  return `rgb(${nums.map(n=>Math.max(0,Math.min(255,Math.round(n)))).join(",")})`;
}

$("path").addEventListener("change",e=>BRIDGE.set_path(e.target.value));
$("force").addEventListener("change",e=>BRIDGE.set_force(e.target.checked));
$("btn_browse").onclick=()=>BRIDGE.run_action("browse");
$("btn_preview").onclick=()=>{ BRIDGE.set_path($("path").value); BRIDGE.run_action("preview"); };
$("btn_apply").onclick=()=>{ BRIDGE.set_path($("path").value); BRIDGE.run_action("apply"); };
$("btn_defaults").onclick=()=>BRIDGE.run_action("defaults");
$("btn_info").onclick=()=>BRIDGE.run_action("info");
$("btn_restore").onclick=()=>BRIDGE.run_action("restore");
$("pf").addEventListener("change",e=>BRIDGE.set_pf(e.target.value));
$("backup").addEventListener("change",e=>BRIDGE.set_backup(e.target.value));
/* facteur edite : commit au change + blur (garde anti-double) */
let fdone=false;
$("fgrid").addEventListener("change",e=>{
  const inp=e.target.closest(".num");
  if (inp && !fdone){ fdone=true; BRIDGE.set_factor(inp.dataset.k,parseFloat(inp.value)||0);
    setTimeout(()=>{fdone=false;},0); }
});
boot();
</script>
</body>
</html>
