<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ECF — vue web</title>
<style>
:root{
  --bg:#05070D; --line:rgba(130,205,255,.10); --line-strong:rgba(130,205,255,.28);
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --amber:#FFC24D;
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
  --rh:26px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{border-bottom:1px solid var(--line);background:rgba(10,15,26,.7)}
.bar{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px}
.bar .name{font:600 12.5px var(--mono);color:#8FE7F5}
.bar .meta{font:11px var(--mono);color:var(--dim)}
.search{display:flex;align-items:center;gap:6px;margin-left:auto}
.search input{height:26px;width:230px;border-radius:8px;border:1px solid var(--line);
  background:rgba(6,11,20,.72);color:var(--txt);font:12px var(--font);padding:0 9px;outline:none}
.search input:focus{border-color:rgba(0,229,255,.45)}
.search .st{font:10.5px var(--mono);color:var(--dim);min-width:70px;text-align:right}
.tools{display:flex;gap:6px;align-items:center;padding:0 12px 8px}
.tbtn{height:26px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);padding:0 10px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  color:var(--muted);font:11.5px var(--font);
  transition:border-color .12s, color .12s, background .12s}
.tbtn:hover{color:var(--txt);border-color:rgba(0,229,255,.45);
  background:rgba(0,229,255,.10)}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tbtn.primary{border-color:rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  color:#DFFAFF;font-weight:600}
.grid{position:relative;overflow:auto;flex:1;cursor:default;background:var(--bg)}
.grid::-webkit-scrollbar,.detail::-webkit-scrollbar{width:11px;height:11px}
.grid::-webkit-scrollbar-track,.detail::-webkit-scrollbar-track{background:rgba(8,12,21,.4)}
.grid::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{
  background:rgba(130,205,255,.20);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
.sizer{position:relative;width:max-content;min-width:100%}
.row{position:absolute;display:flex;align-items:center;height:var(--rh);left:0;right:0;
  padding:0 9px;font:12px var(--mono);color:var(--txt);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;user-select:none}
.row:hover{background:rgba(0,229,255,.07)}
.row.cur{background:rgba(0,229,255,.20);outline:1px solid var(--cyan)}
.row.header{font-weight:700;color:#7fb9ff}
.row.gray{color:var(--dim);font-style:italic}
.row.block{cursor:pointer}
.ind{display:inline-block}
.detail{height:42%;border-top:1px solid var(--line-strong);overflow:auto;
  background:rgba(8,12,21,.5)}
.detail table{border-collapse:collapse;font:12px var(--mono);min-width:100%}
.detail th{position:sticky;top:0;background:#0E1422;color:#8FE7F5;text-align:left;
  font:600 11px var(--mono);padding:5px 10px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap}
.detail td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  max-width:520px;overflow:hidden;text-overflow:ellipsis}
.detail td.ed{cursor:text}
.detail td.ed:hover{background:rgba(0,229,255,.08);
  box-shadow:inset 0 -1px 0 rgba(0,229,255,.45)}
.detail tr:hover td{background:rgba(0,229,255,.05)}
.detail .empty{padding:14px;font:12px var(--font);color:var(--dim)}
.detail .mode{font:10px var(--mono);color:var(--dim);padding:4px 10px;display:block}
input.cedit{font:12px var(--mono);color:var(--txt);width:95%;
  background:rgba(6,11,20,.95);border:1px solid rgba(0,229,255,.55);outline:none;
  border-radius:4px;padding:2px 6px}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <span class="name" id="name">—</span>
    <span class="meta" id="meta"></span>
    <div class="search">
      <input id="q" placeholder="Filtrer…">
      <span class="st" id="qstat"></span>
    </div>
  </div>
  <div class="tools" id="tools"></div>
</div>
<div class="grid" id="grid">
  <div class="sizer" id="sizer">
    <div id="viewport" style="position:absolute;left:0;right:0;top:0"></div>
  </div>
</div>
<div class="detail" id="detail"></div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null, ALL=[], VIEW=[], SEL=-1, DET=null, LBL=null, ACT=null;
const RH=26, OVERSCAN=8;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grid=$("grid"), sizer=$("sizer"), vp=$("viewport");

function boot(){
  if (typeof qt==="undefined"||!qt.webChannelTransport){ setTimeout(boot,300); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.ecfbridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_entries(m => shape(JSON.parse(m)));
  });
}

/* payload COMPLET (cle entries) au boot/refresh ; etat LEGER (detail +
   selection) a chaque clic/edition — meme convention que les autres ponts */
function shape(m){
  if (m.entries) ALL=m.entries;
  if (m.detail) DET=m.detail;
  if (m.selected!==undefined) SEL=m.selected;
  if (m.name) $("name").textContent=m.name;
  if (m.labels) LBL=m.labels;
  if (m.actions) ACT=m.actions;
  $("q").placeholder=(LBL&&LBL.search)||"Filtrer…";
  buildTools();
  applyFilter();
  renderDetail();
}

const TOOLBTNS = [
  ["add_block","add_block",""], ["add_prop","add_prop",""],
  ["add_row","add_row",""], ["catalog","catalog",""],
  ["filter","filter",""], ["disabled_blocks","disabled_blocks",""],
  ["transform","transform",""], ["undo","undo",""], ["save","save","primary"],
];

function buildTools(){
  const box=$("tools");
  const sig=JSON.stringify([LBL,ACT]);
  if (box.dataset.sig===sig) return;   /* rien n'a change : pas de rebuild */
  box.dataset.sig=sig;
  box.innerHTML=TOOLBTNS.map(([action,key,cls])=>{
    const off=(ACT&&ACT[key]===false)?" disabled":"";
    return `<button class="tbtn ${cls}${off}" data-action="${action}">${esc((LBL&&LBL[key])||key)}</button>`;
  }).join("");
}

$("tools").addEventListener("click",e=>{
  const b=e.target.closest("button[data-action]");
  if (b && !b.disabled) BRIDGE.run_action(b.dataset.action);
});

function applyFilter(){
  const q=$("q").value.trim().toLowerCase();
  VIEW = q ? ALL.filter(e=>e.search.indexOf(q)>=0 || (e.kind!=="block"&&e.label.toLowerCase().indexOf(q)>=0))
           : ALL;
  /* conserver l'index d'origine ALL -> VIEW : select_entry vise l'index
     du pont, pas la position dans la vue filtree */
  for (const e of VIEW) e._idx = ALL.indexOf(e);
  $("meta").textContent=`${ALL.length} entrées`;
  $("qstat").textContent=q?`${VIEW.length}/${ALL.length}`:"";
  sizer.style.height=(VIEW.length*RH+8)+"px";
  grid.scrollTop=0;
  render();
}

function render(){
  const first=Math.max(0,Math.floor(grid.scrollTop/RH)-OVERSCAN);
  const last=Math.min(VIEW.length,Math.ceil((grid.scrollTop+grid.clientHeight)/RH)+OVERSCAN);
  let html="";
  for (let i=first;i<last;i++){
    const e=VIEW[i];
    const cls=e.kind==="block"?"block":e.kind;
    const cur=(e.kind==="block"&&e._idx===SEL)?" cur":"";
    html+=`<div class="row ${cls}${cur}" data-i="${e._idx}" style="top:${i*RH}px">`
      +`<span class="ind" style="width:${e.depth*16}px"></span>${esc(e.label)}</div>`;
  }
  vp.innerHTML=html;
}

function renderDetail(){
  const box=$("detail");
  if (!DET || !DET.rows.length){
    box.innerHTML=`<span class="empty">Sélectionnez un bloc pour voir ses propriétés.</span>`;
    return;
  }
  let html=`<span class="mode">${esc(DET.mode)}</span><table><thead><tr>`
    +DET.cols.map(c=>`<th>${esc(c)}</th>`).join("")
    +`</tr></thead><tbody>`;
  DET.rows.forEach((row,r)=>{
    html+="<tr>";
    row.forEach((cell,c)=>{
      if (cell.e) html+=`<td class="ed" data-r="${r}" data-c="${c}" title="${esc(cell.t)}">${esc(cell.t)}</td>`;
      else html+=`<td title="${esc(cell.t)}">${esc(cell.t)}</td>`;
    });
    html+="</tr>";
  });
  box.innerHTML=html+"</tbody></table>";
}

function openEditor(td){
  if (td.querySelector("input")) return;
  const r=+td.dataset.r, c=+td.dataset.c;
  const input=document.createElement("input");
  input.className="cedit";
  input.value=DET.rows[r][c].t;
  td.textContent="";
  td.appendChild(input);
  input.focus();
  let done=false;
  const commit=()=>{ if (done) return; done=true;
    BRIDGE.set_cell(r,c,input.value); };  /* l'etat re-pousse rafraichit */
  input.addEventListener("blur",commit);
  input.addEventListener("change",commit);
}

vp.addEventListener("click",ev=>{
  const row=ev.target.closest(".row.block");
  if (!row) return;
  SEL=+row.dataset.i;
  BRIDGE.select_entry(SEL);   /* l'etat leger (detail+selection) revient */
  render();
});

$("detail").addEventListener("dblclick",ev=>{
  const td=ev.target.closest("td.ed");
  if (td) openEditor(td);
});

$("q").addEventListener("input",applyFilter);
grid.addEventListener("scroll",render);
window.addEventListener("resize",render);
boot();
</script>
</body>
</html>
