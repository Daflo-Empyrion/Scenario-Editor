<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bilan de santé — Centre de vérification</title>
<style>
:root{
  --bg:#05070D; --line:rgba(130,205,255,.10); --line-strong:rgba(130,205,255,.28);
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --amber:#FFC24D; --green:#3DDC84; --red:#FF5C5C;
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding:0}
.intro{padding:10px 14px 6px;font:12px var(--font);color:var(--muted);
  white-space:normal;line-height:1.45}
.rows{flex:1;overflow:auto;padding:6px 10px}
.rows::-webkit-scrollbar{width:11px}
.rows::-webkit-scrollbar-track{background:rgba(8,12,21,.4)}
.rows::-webkit-scrollbar-thumb{background:rgba(130,205,255,.20);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
.cat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--line);margin-bottom:6px;
  background:linear-gradient(180deg, rgba(27,35,55,.45), rgba(16,22,38,.45))}
.cat .title{font:600 12.5px var(--font);color:var(--txt);min-width:200px}
.cat .st{flex:1;font:12px var(--mono);color:var(--dim)}
.cat .st.ok{color:var(--green)}
.cat .st.ko{color:var(--red)}
.cat .spin{width:14px;height:14px;border:2px solid rgba(0,229,255,.25);
  border-top-color:var(--cyan);border-radius:50%;flex:0 0 auto;
  animation:rot .8s linear infinite;display:none}
.running .cat .spin{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.tbtn{height:28px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);padding:0 11px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  color:var(--muted);font:11.5px var(--font);
  transition:border-color .12s, color .12s, background .12s}
.tbtn:hover{color:var(--txt);border-color:rgba(0,229,255,.45);
  background:rgba(0,229,255,.10)}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tbtn.primary{border-color:rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  color:#DFFAFF;font-weight:600}
.bottom{display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-top:1px solid var(--line);background:rgba(10,15,26,.7)}
.summary{flex:1;font:11.5px var(--mono);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.summary.ko{color:var(--red)}
.summary.ok{color:var(--green)}
</style>
</head>
<body>
<div class="intro" id="intro"></div>
<div class="rows" id="rows"></div>
<div class="bottom">
  <span class="summary" id="summary"></span>
  <button class="tbtn primary" id="btn_check"></button>
  <button class="tbtn" id="btn_close"></button>
</div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null, M=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function boot(){
  if (typeof qt==="undefined"||!qt.webChannelTransport){ setTimeout(boot,300); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.bridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_init(m => {
      shape(JSON.parse(m));
      /* parite Qt : le bilan se lance tout seul a l'ouverture (refresh()
         dans le __init__ du dialogue Qt) */
      if (!JSON.parse(m).has_run) BRIDGE.run_action("check_all");
    });
  });
}

function shape(m){
  M=m;
  const L=m.labels;
  $("intro").textContent=L.intro;
  $("btn_check").textContent=L.check_all;
  $("btn_check").disabled=!!m.running;
  $("btn_close").textContent=L.close;
  const s=$("summary");
  s.textContent=m.summary;
  s.className="summary"+(m.summary_state?" "+m.summary_state:"");
  document.body.classList.toggle("running",!!m.running);
  $("rows").innerHTML=m.rows.map(r=>
    `<div class="cat">`
    +`<span class="spin"></span>`
    +`<span class="title">${esc(r.title)}</span>`
    +`<span class="st ${r.ok?"ok":"ko"}">${r.ok?"✓ ":""}${esc(r.text)}</span>`
    +`<button class="tbtn" data-action="${esc(r.action)}"`
    +`${r.ok?" disabled":""}>${esc(L.view_detail)}</button>`
    +`</div>`).join("");
}

$("rows").addEventListener("click",e=>{
  const b=e.target.closest("button[data-action]");
  if (b && !b.disabled) BRIDGE.run_action(b.dataset.action);
});
$("btn_check").onclick=()=>BRIDGE.run_action("check_all");
$("btn_close").onclick=()=>BRIDGE.run_action("close");
boot();
</script>
</body>
</html>
