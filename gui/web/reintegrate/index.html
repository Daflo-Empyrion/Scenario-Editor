<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réintégration de playfields</title>
<style>
:root{
  --bg:#05070D; --line:rgba(130,205,255,.10); --line-strong:rgba(130,205,255,.28);
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --amber:#FFC24D;
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;font-size:12px}
.top{border-bottom:1px solid var(--line);background:rgba(10,15,26,.7);
  padding:6px 12px;display:flex;align-items:center;gap:10px}
.top label{font:11px var(--mono);color:var(--dim)}
.top input[type=number]{width:64px;height:24px;border-radius:8px;
  border:1px solid var(--line);background:rgba(6,11,20,.72);color:var(--txt);
  font:12px var(--mono);padding:0 6px;outline:none}
.tbtn{height:26px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);padding:0 10px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  color:var(--muted);font:11.5px var(--font)}
.tbtn:hover{color:var(--txt);border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.10)}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tbtn.primary{border-color:rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  color:#DFFAFF;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;font:11.5px var(--font);
  color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--cyan)}
.tree{flex:1;overflow:auto;padding:4px 10px}
.tree::-webkit-scrollbar,.preview::-webkit-scrollbar{width:10px}
.tree::-webkit-scrollbar-thumb{background:rgba(130,205,255,.20);border-radius:6px}
.grp{font:600 11.5px var(--mono);color:#8FE7F5;padding:6px 0 3px;
  display:flex;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:20px 240px 110px 1fr;gap:8px;
  padding:3px 0;border-bottom:1px solid var(--line);align-items:center}
.row input{accent-color:var(--cyan);cursor:pointer}
.row .nm{font:12px var(--mono);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row .kd{font:11px var(--mono);color:var(--amber)}
.row .ds{font:11px var(--font);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.plab{padding:6px 12px 2px;font:11px var(--mono);color:var(--dim)}
.preview{height:150px;overflow:auto;margin:0 12px;border:1px solid var(--line);
  border-radius:10px;background:rgba(8,12,21,.5);padding:6px 10px;
  font:11px var(--mono);color:var(--muted);white-space:pre-wrap}
.bottom{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bottom .sp{flex:1}
.status{padding:5px 12px;font:11px var(--mono);color:var(--muted);
  border-top:1px solid var(--line);white-space:pre-wrap;max-height:72px;
  overflow:auto}
</style>
</head>
<body>
<div class="top">
  <label for="per" id="lbl_per"></label>
  <input type="number" id="per" min="1" max="20" value="2">
  <span style="flex:1"></span>
  <button class="tbtn" id="btn_info"></button>
</div>
<div class="top" id="flags" style="display:none">
  <label class="chk"><input type="checkbox" id="legacy"> <span id="txt_legacy"></span></label>
  <label class="chk"><input type="checkbox" id="arrivals"> <span id="txt_arrivals"></span></label>
</div>
<div class="tree" id="tree"></div>
<div class="plab" id="lbl_preview"></div>
<pre class="preview" id="preview"></pre>
<div class="bottom">
  <button class="tbtn" id="btn_preview"></button>
  <button class="tbtn primary" id="btn_apply" disabled></button>
  <span class="sp"></span>
  <button class="tbtn" id="btn_close"></button>
</div>
<div class="status" id="status"></div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null, M=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function boot(){
  if (typeof qt==="undefined"||!qt.webChannelTransport){ setTimeout(boot,300); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.bridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_init(m => shape(JSON.parse(m)));
  });
}

function shape(m){
  M=m; const L=m.labels;
  $("lbl_per").textContent=L.per_system;
  $("per").title=L.per_system_tip;
  $("btn_info").textContent=L.info;
  $("lbl_preview").textContent=L.preview_label;
  $("btn_preview").textContent=L.preview_btn;
  $("btn_apply").textContent=L.apply;
  $("btn_close").textContent=L.close;
  $("flags").style.display=(m.legacy.n||m.arrivals.n)?"flex":"none";
  $("legacy").checked=m.legacy.on; $("txt_legacy").textContent=m.legacy.text;
  $("legacy").parentElement.style.display=m.legacy.n?"flex":"none";
  $("arrivals").checked=m.arrivals.on;
  $("txt_arrivals").textContent=m.arrivals.text;
  $("arrivals").parentElement.style.display=m.arrivals.n?"flex":"none";
  $("per").value=m.per_system;
  $("tree").innerHTML=m.groups.map(g=>
    `<div class="grp">${esc(g.label)}</div>`
    +g.items.map(it=>
      `<div class="row" title="${esc(it.desc)}">`
      +`<input type="checkbox" data-n="${esc(it.name)}"${it.checked?" checked":""}>`
      +`<span class="nm">${esc(it.name)}</span>`
      +`<span class="kd">${esc(it.kind)}</span>`
      +`<span class="ds">${esc(it.desc)}</span></div>`).join("")).join("");
  $("preview").textContent=m.preview||"";
  $("btn_apply").disabled=!m.apply_enabled;
  $("status").textContent=m.status;
}

$("tree").addEventListener("change",e=>{
  const box=e.target.closest("input[type=checkbox]");
  if (box) BRIDGE.set_checked(box.dataset.n,box.checked);
});
$("legacy").addEventListener("change",e=>BRIDGE.set_legacy(e.target.checked));
$("arrivals").addEventListener("change",e=>BRIDGE.set_arrival(e.target.checked));
$("per").addEventListener("change",e=>BRIDGE.set_per_system(+e.target.value||2));
$("btn_preview").onclick=()=>BRIDGE.run_action("preview");
$("btn_apply").onclick=()=>BRIDGE.run_action("apply");
$("btn_info").onclick=()=>BRIDGE.run_action("info");
$("btn_close").onclick=()=>BRIDGE.run_action("close");
boot();
</script>
</body>
</html>
