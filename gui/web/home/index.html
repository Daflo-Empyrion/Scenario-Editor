<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<style>
:root{
  --txt:#E9F2FA; --muted:#8FA3B8; --dim:#5E7085;
  --cyan:#00E5FF; --violet:#7E68FF; --amber:#FFC24D;
  --line:rgba(130,205,255,.12); --line-strong:rgba(130,205,255,.30);
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);overflow:hidden;
  -webkit-font-smoothing:antialiased;background:#05070D}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  align-items:center;padding:5vh 24px 3vh;overflow:auto}
.wrap::-webkit-scrollbar{width:11px}
.wrap::-webkit-scrollbar-thumb{background:rgba(130,205,255,.2);border-radius:6px}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(145deg, rgba(0,229,255,.25), rgba(126,104,255,.28));
  border:1px solid rgba(150,230,255,.35);
  box-shadow:0 0 40px -8px rgba(0,229,255,.7), inset 0 1px 0 rgba(255,255,255,.2)}
.logo svg{width:30px;height:30px;stroke:#DFF9FF;fill:none;stroke-width:1.5}
h1{margin:18px 0 6px;font-size:26px;font-weight:650;letter-spacing:.4px;text-align:center}
.sub{margin:0;color:var(--muted);font-size:13.5px;text-align:center}
.actions{display:flex;gap:12px;margin:26px 0 8px;flex-wrap:wrap;justify-content:center}
.act{height:38px;padding:0 18px;border-radius:11px;display:inline-flex;align-items:center;
  gap:9px;cursor:pointer;font:600 13px var(--font);color:#DFFAFF;
  border:1px solid rgba(0,229,255,.5);
  background:linear-gradient(180deg, rgba(0,229,255,.22), rgba(0,140,190,.18));
  box-shadow:0 0 22px -8px rgba(0,229,255,.8), inset 0 1px 0 rgba(255,255,255,.15)}
.act.ghost{color:var(--txt);border-color:var(--line-strong);
  background:linear-gradient(180deg, rgba(40,52,80,.55), rgba(16,22,38,.55));
  box-shadow:none;font-weight:500}
.act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.act:hover{filter:brightness(1.25)}
.sect{width:100%;max-width:780px;margin-top:30px}
.sect h2{font:600 11px var(--mono);letter-spacing:1.6px;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px 4px}
.recents{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.recent{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;
  cursor:pointer;background:linear-gradient(180deg, rgba(24,31,50,.72), rgba(11,15,26,.66));
  border:1px solid var(--line);backdrop-filter:blur(18px);
  transition:border-color .15s, transform .15s, box-shadow .15s}
.recent:hover{border-color:rgba(0,229,255,.5);transform:translateY(-2px);
  box-shadow:0 14px 34px -18px rgba(0,229,255,.5)}
.recent .ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;
  place-items:center;background:rgba(0,229,255,.09);border:1px solid rgba(0,229,255,.2);
  color:#8FF2FF}
.recent .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.recent .nb{min-width:0}
.recent .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.recent .pa{font:10.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:3px}
.empty{color:var(--dim);font-size:12.5px;padding:14px 4px}
.footer{margin-top:auto;padding-top:22px;font:10.5px var(--mono);color:var(--dim)}
</style>
</head>
<body>
<img class="bg" src="__BG_DATA_URI__" alt="">
<div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 12 3 7m9 5 9-5m-9 5v10"/></svg></div>
  <h1 id="title">—</h1>
  <p class="sub" id="subtitle">—</p>
  <div class="actions">
    <button class="act" id="btnNew">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="lblNew">—</span>
    </button>
    <button class="act ghost" id="btnManage">
      <svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span id="lblManage">—</span>
    </button>
  </div>
  <div class="sect">
    <h2 id="lblRecent">—</h2>
    <div class="recents" id="recents"></div>
  </div>
  <div class="footer" id="footer">—</div>
</div>

<script>__QWEBCHANNEL_JS__</script>
<script>
"use strict";
let BRIDGE=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function boot(){
  if (typeof qt === "undefined" || !qt.webChannelTransport){ setTimeout(boot, 200); return; }
  new QWebChannel(qt.webChannelTransport, ch => {
    BRIDGE = ch.objects.homebridge;
    BRIDGE.data_changed.connect(p => shape(JSON.parse(p)));
    BRIDGE.get_home(p => shape(JSON.parse(p)));
  });
}
function shape(m){
  const L = m.labels || {};
  document.getElementById("title").textContent = L.title;
  document.getElementById("subtitle").textContent = L.subtitle;
  document.getElementById("lblNew").textContent = L.new_project;
  document.getElementById("lblManage").textContent = L.manage;
  document.getElementById("lblRecent").textContent = L.recent;
  document.getElementById("footer").textContent = L.footer;
  const box = document.getElementById("recents");
  if (!m.recents.length){
    box.innerHTML = `<div class="empty">${esc(L.no_recents)}</div>`;
    return;
  }
  box.innerHTML = m.recents.map(r =>
    `<div class="recent" data-p="${esc(r.path)}">` +
    `<div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>` +
    `<div class="nb"><div class="nm">${esc(r.name)}</div><div class="pa">${esc(r.path)}</div></div></div>`).join("");
  box.querySelectorAll(".recent").forEach(el => {
    el.onclick = () => BRIDGE.open_recent(el.dataset.p);
  });
}
document.getElementById("btnNew").onclick = ()=>BRIDGE && BRIDGE.new_project();
document.getElementById("btnManage").onclick = ()=>BRIDGE && BRIDGE.manage_projects();
boot();
</script>
</body>
</html>
